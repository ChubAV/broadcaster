global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "broadcaster-web"
    static_configs:
      - targets: ["web-broadcaster:8000"]

  - job_name: "broadcaster-flower"
    static_configs:
      - targets: ["flower-broadcaster:5555"]

  - job_name: "db-node"
    static_configs:
      - targets: ["192.168.0.5:9100"]
        labels:
          instance: "db-server"

  - job_name: "db-postgres"
    static_configs:
      - targets: ["192.168.0.5:9308"]
        labels:
          instance: "db-server"

  - job_name: "redis-node"
    static_configs:
      - targets: ["192.168.0.7:9100"]
        labels:
          instance: "redis-server"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["192.168.0.7:9308"]
        labels:
          instance: "redis-server"
