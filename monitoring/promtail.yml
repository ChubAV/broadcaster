server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_compose_service']
        target_label: compose_service
      # wa-worker labels (containers created via Docker API, not compose)
      - source_labels: ['__meta_docker_container_label_broadcaster_role']
        target_label: broadcaster_role
      - source_labels: ['__meta_docker_container_label_broadcaster_account_id']
        target_label: account_id

    pipeline_stages:
      - docker: {}

      # Compose services (Python structlog — level is a string)
      - match:
          selector: '{compose_project=~".+"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
                  msg: msg
            - labels:
                level:

      # wa-worker containers (Pino — level is numeric)
      - match:
          selector: '{broadcaster_role="wa-worker"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  accountId: accountId
            - template:
                source: level
                template: '{{ if eq .Value "10" }}trace{{ else if eq .Value "20" }}debug{{ else if eq .Value "30" }}info{{ else if eq .Value "40" }}warn{{ else if eq .Value "50" }}error{{ else if eq .Value "60" }}fatal{{ else }}{{ .Value }}{{ end }}'
            - labels:
                level:
