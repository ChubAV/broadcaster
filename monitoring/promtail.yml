server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: broadcaster
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Docker JSON log wrapper: {"log":"...","stream":"...","time":"..."}
      - docker: {}

      # Extract level from structured JSON logs
      - match:
          selector: '{job="broadcaster"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
                  msg: msg
            - labels:
                level:
            - label_drop:
                - filename
