x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: broadcaster-app
  environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      WA_BRIDGE_URLS: ${WA_BRIDGE_URLS}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  env_file: .env

x-wa-bridge-base: &wa-bridge-base
  build:
    context: ./wa_bridge
    dockerfile: Dockerfile
  environment:
    PORT: 3000
    IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS:-300000}
  volumes:
    - wa_sessions:/app/sessions
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
    interval: 10s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits:
        memory: 512M

services:
  web:
    <<: *app-base
    entrypoint: ["./entrypoint.sh"]
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    container_name: web-broadcaster
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery-beat:
    <<: *app-base
    container_name: celery-beat-broadcaster
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-telegram:
    <<: *app-base
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=telegram --concurrency=4
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  celery-worker-whatsapp:
    <<: *app-base
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=whatsapp --concurrency=2
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  celery-worker-default:
    <<: *app-base
    container_name: celery-worker-default-broadcaster
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=default --concurrency=2
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

# Мост к Whatsapp
  wa-bridge:
    <<: *wa-bridge-base
    container_name: wa-bridge-broadcaster

# Базы данных
  db:
    image: postgres:16-alpine
    container_name: db-broadcaster
    environment:
      POSTGRES_DB: broadcaster
      POSTGRES_USER: broadcaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broadcaster}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadcaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-broadcaster
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Служебные сервисы
  flower:
    <<: *app-base
    container_name: flower-broadcaster
    command: uv run celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  wa_sessions:
