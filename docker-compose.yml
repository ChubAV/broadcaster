services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    container_name: web-broadcaster
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  db:
    image: postgres:16-alpine
    container_name: db-broadcaster
    environment:
      POSTGRES_DB: broadcaster
      POSTGRES_USER: broadcaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broadcaster}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadcaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-broadcaster
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-beat-broadcaster
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  celery-worker-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=telegram --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    deploy:
      replicas: 2

  celery-worker-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=whatsapp --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    deploy:
      replicas: 2

  celery-worker-default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker-default-broadcaster
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=default --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower-broadcaster
    command: uv run celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env

  mongo:
    image: mongo:7
    container_name: mongo-broadcaster
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  wa-bridge-1:
    build:
      context: ./wa_bridge
      dockerfile: Dockerfile
    container_name: wa-bridge-1-broadcaster
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongo:27017/whatsapp_sessions
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  wa-bridge-2:
    build:
      context: ./wa_bridge
      dockerfile: Dockerfile
    container_name: wa-bridge-2-broadcaster
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongo:27017/whatsapp_sessions
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  wa-bridge-3:
    build:
      context: ./wa_bridge
      dockerfile: Dockerfile
    container_name: wa-bridge-3-broadcaster
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongo:27017/whatsapp_sessions
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
  mongodata:
