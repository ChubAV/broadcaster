x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: broadcaster-app
  environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      WA_BRIDGE_URLS: ${WA_BRIDGE_URLS}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  env_file: .env

x-wa-bridge-base: &wa-bridge-base
  build:
    context: ./wa_bridge
    dockerfile: Dockerfile
  environment:
    MONGODB_URI: ${MONGODB_URI}
    PORT: 3000
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
    interval: 10s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits:
        memory: 2G

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-broadcaster
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN}
    command: /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot-broadcaster
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

  web:
    <<: *app-base
    entrypoint: ["./entrypoint.sh"]
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    container_name: web-broadcaster
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery-beat:
    <<: *app-base
    container_name: celery-beat-broadcaster
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      web:
        condition: service_healthy


  celery-worker-telegram:
    <<: *app-base
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=telegram --concurrency=4
    depends_on:
      web:
        condition: service_healthy

  celery-worker-whatsapp:
    <<: *app-base
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=whatsapp --concurrency=2
    depends_on:
      web:
        condition: service_healthy

  celery-worker-default:
    <<: *app-base
    container_name: celery-worker-default-broadcaster
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --queues=default --concurrency=2
    depends_on:
      web:
        condition: service_healthy

# Мосты к Whatsapp
  wa-bridge-1:
    <<: *wa-bridge-base
    container_name: wa-bridge-1-broadcaster

volumes:
  certbot-webroot:
  certbot-certs:
