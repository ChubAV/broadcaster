{% extends "base.html" %}
{% block title %}Профиль — Broadcaster{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
  <h1 class="text-lg font-semibold text-gray-900 mb-6">Профиль</h1>

  {% if error %}
  <div class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">{{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form method="post" action="/profile" class="space-y-4">
      <div>
        <label for="timezone" class="block text-sm font-medium text-gray-700 mb-1.5">Часовой пояс</label>
        <select name="timezone" id="timezone" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-colors">
          {% for value, label in timezone_choices %}
          <option value="{{ value }}" {{ 'selected' if user.timezone == value }}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="pt-4 border-t border-gray-200">
        <button type="submit" class="bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-indigo-700 transition-colors">Сохранить</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
