{% extends "base.html" %}
{% block title %}Вход - Broadcaster{% endblock %}
{% block body %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <a href="/login" class="flex justify-center">
            <span class="text-2xl font-bold tracking-tight text-primary-600 hover:text-primary-700 transition-colors">Broadcaster</span>
        </a>
        <h2 class="mt-4 text-center text-xl font-bold tracking-tight text-slate-900">Вход в систему</h2>
    </div>
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-sm">
        {% if error %}
        <div class="mb-4 rounded-xl bg-red-50 p-4 text-sm text-red-700 ring-1 ring-red-100 animate-fade-in">{{ error }}</div>
        {% endif %}
        <div class="bg-white rounded-xl shadow-card border border-slate-200/80 p-6">
            <form method="POST" action="/login" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-900">Email</label>
                    <input id="email" name="email" type="email" required class="mt-2 block w-full rounded-lg border-0 py-2 px-3 text-slate-900 shadow-sm ring-1 ring-slate-300 focus:ring-2 focus:ring-primary-500 transition-shadow sm:text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-900">Пароль</label>
                    <input id="password" name="password" type="password" required class="mt-2 block w-full rounded-lg border-0 py-2 px-3 text-slate-900 shadow-sm ring-1 ring-slate-300 focus:ring-2 focus:ring-primary-500 transition-shadow sm:text-sm">
                </div>
                <button type="submit" class="flex w-full justify-center rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all duration-200">Войти</button>
            </form>
        </div>
        <p class="mt-4 text-center text-sm text-slate-500">
            Нет аккаунта? <a href="/register" class="font-medium text-primary-600 hover:text-primary-700 transition-colors">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
